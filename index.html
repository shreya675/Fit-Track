<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#244c3b" />
    <meta name="description" content="Make room for everyday movement. Track workouts, meals, hydration, and personal goals in one calm fitness workspace." />
    <title>FitTrack · Your everyday fitness workspace</title>
    <script>
      // Apply the saved or system colour theme before the first paint so there is no light flash.
      try {
        var saved = localStorage.getItem('fittrack.theme');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
